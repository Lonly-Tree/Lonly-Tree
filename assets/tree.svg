<svg xmlns="http://www.w3.org/2000/svg" width="360" height="300" viewBox="0 0 360 300" role="img" aria-labelledby="title">
<title id="title">Animated ASCII tree</title>
<style>
text { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
@keyframes enter { from { opacity:0; transform:translateY(5px) } to { opacity:1; transform:translateY(0) } }
@keyframes type { from { clip-path:inset(0 100% 0 0) } to { clip-path:inset(0 0 0 0) } }
.reveal { animation:enter .45s ease-out both; }
.tree-row { animation:type .25s linear both; }
@media (prefers-reduced-motion: reduce) { .reveal,.tree-row { animation:none!important; } }
</style>
<rect x=".5" y=".5" width="359" height="299" rx="18" fill="#0c1512" stroke="#2b4032"/>
<g class="tree-row" style="animation-delay:0.000s"><text x="20" y="25" xml:space="preserve" font-size="12" fill="#b1ec91">                    .</text></g>
<g class="tree-row" style="animation-delay:0.065s"><text x="20" y="37" xml:space="preserve" font-size="12" fill="#b1ec91">                   /|\</text></g>
<g class="tree-row" style="animation-delay:0.130s"><text x="20" y="49" xml:space="preserve" font-size="12" fill="#b1ec91">                 .::|::.</text></g>
<g class="tree-row" style="animation-delay:0.195s"><text x="20" y="61" xml:space="preserve" font-size="12" fill="#b1ec91">               .::**|**::.</text></g>
<g class="tree-row" style="animation-delay:0.260s"><text x="20" y="73" xml:space="preserve" font-size="12" fill="#b1ec91">              .:**/ | \**:.</text></g>
<g class="tree-row" style="animation-delay:0.325s"><text x="20" y="85" xml:space="preserve" font-size="12" fill="#b1ec91">            .:**/  /|\  \**:.</text></g>
<g class="tree-row" style="animation-delay:0.390s"><text x="20" y="97" xml:space="preserve" font-size="12" fill="#b1ec91">          .::**   / | \   **::.</text></g>
<g class="tree-row" style="animation-delay:0.455s"><text x="20" y="109" xml:space="preserve" font-size="12" fill="#b1ec91">             / .:* /|\ *:. \</text></g>
<g class="tree-row" style="animation-delay:0.520s"><text x="20" y="121" xml:space="preserve" font-size="12" fill="#b1ec91">           .::*  /  |  \  *::.</text></g>
<g class="tree-row" style="animation-delay:0.585s"><text x="20" y="133" xml:space="preserve" font-size="12" fill="#b1ec91">         .::**  /  /|\  \  **::.</text></g>
<g class="tree-row" style="animation-delay:0.650s"><text x="20" y="145" xml:space="preserve" font-size="12" fill="#b1ec91">       .::**   /  / | \  \   **::.</text></g>
<g class="tree-row" style="animation-delay:0.715s"><text x="20" y="157" xml:space="preserve" font-size="12" fill="#b1ec91">          / .:*  /  |  \  *:. \</text></g>
<g class="tree-row" style="animation-delay:0.780s"><text x="20" y="169" xml:space="preserve" font-size="12" fill="#b1ec91">        .::*   /   /|\   \   *::.</text></g>
<g class="tree-row" style="animation-delay:0.845s"><text x="20" y="181" xml:space="preserve" font-size="12" fill="#b1ec91">      .::**   /   / | \   \   **::.</text></g>
<g class="tree-row" style="animation-delay:0.910s"><text x="20" y="193" xml:space="preserve" font-size="12" fill="#b1ec91">    .::**    /   /  |  \   \    **::.</text></g>
<g class="tree-row" style="animation-delay:0.975s"><text x="20" y="205" xml:space="preserve" font-size="12" fill="#b1ec91">   &#x27;--------&#x27;---&#x27;---|---&#x27;---&#x27;--------&#x27;</text></g>
<g class="tree-row" style="animation-delay:1.040s"><text x="20" y="217" xml:space="preserve" font-size="12" fill="#b1ec91">                  |||</text></g>
<g class="tree-row" style="animation-delay:1.105s"><text x="20" y="229" xml:space="preserve" font-size="12" fill="#b1ec91">                  |||</text></g>
<g class="tree-row" style="animation-delay:1.170s"><text x="20" y="241" xml:space="preserve" font-size="12" fill="#b1ec91">                  |||</text></g>
<g class="tree-row" style="animation-delay:1.235s"><text x="20" y="253" xml:space="preserve" font-size="12" fill="#b1ec91">                __|||__</text></g>
<g class="tree-row" style="animation-delay:1.300s"><text x="20" y="265" xml:space="preserve" font-size="12" fill="#b1ec91">             __/  /|\  \__</text></g>
<g class="tree-row" style="animation-delay:1.365s"><text x="20" y="277" xml:space="preserve" font-size="12" fill="#b1ec91">          __/____/ | \____\__</text></g>
</svg>
